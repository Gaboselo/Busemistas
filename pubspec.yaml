name: transporte_app
description: "Proyecto Busemistas USM"
publish_to: 'none'
version: 1.0.0+1
 
environment:
  sdk: '>=3.2.0 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
 
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.2
  geolocator: ^13.0.1
  provider: ^6.1.2
  flutter_map: ^7.0.2   # mapa OSM sin API Key
  latlong2: ^0.9.0      # tipo LatLng para flutter_map
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
 
flutter:
  uses-material-design: true

  assets:
    - assets/icono_app.png



flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icono_app.png"
  min_sdk_android: 21 # compatible con la mayoría de los teléfonos