name: transporte_app
description: "Proyecto Busemistas USM"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.2
  geolocator: ^13.0.1
  provider: ^6.1.2
  flutter_map: ^7.0.2   # mapa OSM sin API Key
  latlong2: ^0.9.0      # tipo LatLng para flutter_map

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
